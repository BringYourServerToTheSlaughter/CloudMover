[project]
name = "cloudmover"
dynamic = ["version"]
description = "Safe, resumable cloud file migration engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[tool.setuptools.dynamic]
version = {attr = "src.cloudmover.version.VERSION"}
